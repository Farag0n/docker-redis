services:
  redis:
    image: redis:8
    container_name: redis-db
    restart: unless-stopped

    ports:
      - "127.0.0.1:5053:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"

    volumes:
      - redis_data:/data

volumes:
  redis_data: